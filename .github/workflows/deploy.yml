name: Deploy NexusVoice Studio

on:
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Check types
        run: npm run typecheck

      - name: Build static Studio
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /NexusVoice

      - name: Validate static export
        run: npm run validate:export

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: studio/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
